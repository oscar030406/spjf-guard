version: 1
data:
  submissions: data/accoding/parquet/submissions.parquet
  total_rows: 4046652
  row_bounds: [0, 1942393, 2589857, 3237322, 4046652]
  sealed_first_id: 3246174
  devtest_first_id: 2598676
  split_rule: round(q * total_rows), q = [0, 0.48, 0.64, 0.80, 1]
  history_rule: precheck compute_features, lag=0, strictly smaller ids
  heavy_rule: precheck heavy_threshold, judged training rows, p95(time_cost_ms)
  heavy_threshold_reference_ms: 1314.0
predictor:
  models: [M1, M2, M3, M4, M5]
  train_sample_rows: 1000000
  train_sample_seed: 12345
  seeds: [0, 1, 2]
  num_leaves: 31
  rounds: 244
  selection_source: evidence/accoding_v2/out_accoding_v2.txt, stage pred lag0_select
  regression_objective: regression
  regression_target: log1p(time_cost_ms / 1000)
  heavy_objective: binary
  lgb_fixed:
    learning_rate: 0.05
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    num_threads: 4
    verbose: -1
    force_row_wise: true
  lgb_seed_offsets: {bagging_seed: 7, feature_fraction_seed: 13, data_random_seed: 19}
  ensemble_rule: float32 arithmetic mean of predictions over seeds, as load_preds
  score_model: M4
  score_key: accoding_m4_log
  policy_label: SPJF-E
  score_note: Historical Table 9 label; actually log1p regression, not expected-cost Tweedie.
trace:
  shapes: [poisson, deadline]
  calibration_seed: 300
  seeds: [300, 301, 302, 303, 304]
  busy_work_target_s: 14400.0
  busy_work_target_kind: pinned precheck BUSY_WORK_TARGET
  compression_rule: precheck calib_scale on each evaluated block, shape and seed 300
  compression_search: {lo: 0.0000001, hi: 10.0, iterations: 60, midpoint: geometric}
  compression_application: precheck apply_scale, compress episode starts only
  capacity_kind: pinned from development trace.json; never retuned on evaluated block
  loads: [{rho: 0.5, k: 8}, {rho: 0.8, k: 5}, {rho: 1.0, k: 4}]
  gamma: 0.7208696319231445
  tau_h: 0.5
  shape_kind: pinned cbshape.json, codebench_v2_cache ev.parquet, 469360 rows, 28 bins
  cbshape_source_sha256: 6b0c51fb881fcf0d5d0db95b103bbb39bfd1ce4e0d1910c58c1647873f5b2726
  trace_source_sha256: 3a51c2f50a121ed009bc5da3cefc5425e44222f8a5f5a902ae5af8d7ed253787
  episode_cap_h: 72.0
  practice_chunk: 2000
  practice_min_duration_s: 600.0
  missing_contest_duration_s: 3600.0
  anchor_rule: each contest's first id among all rows up to the evaluated block's end, with metadata start_time, running maximum
  anchor_kind: on dev-test equal to the precheck development anchors (checked); on the sealed tail the development and sealed rows
  svc_fixed_s: 0.5
  service_cap_s: 30.5
  service_rule: min(time_cost_ms / 1000 + svc_fixed_s, service_cap_s)
  service_kind: pinned precheck main service assumption and development maximum
  rank_rule: stable order by quantised integer-microsecond arrival, then original input index
  precheck_reference_scales: {poisson: 0.014892232655028845, deadline: 0.01485765840468662}
guard:
  params_files: [outputs/selection_v4/selected_parameters.csv]
  family: joint
  promises_cb_s: [300, 600, 1200]
  codebench_limit_s: 60.0
  scaling_rule: G, b0_base_s, gam_base_s multiplied by service_cap_s / codebench_limit_s
  capacity_scaling_rule: b0 and gamma additionally multiplied by k / 4; eta unchanged
metrics:
  waiting_population: all evaluated jobs, no deadline window
  harm_fcfs_max_s: 1.0
  fired_fraction_rule: package n_forced / n_dispatch for Guard; zero for unwrapped baselines
  gap_rule: (FCFS - policy) / (FCFS - SJF), per cell and ratio of draw means
  gap_zero_denominator: undefined
  tail_fractions: [0.01, 0.05]
  tail_rule: descending cost, floor(fraction * n) jobs, as precheck stage_compare
  measured_tail_population: positive recorded time_cost, as stage_compare
resources:
  threads: 4
  arrow_read_threads: false
  memory_limit_gb: 20
online:
  # Added 2026-10-01, before the freeze: every scored policy is also replayed on the online
  # clock, so the one sealed evaluation reports both clocks.
  rule: a job's features use the evaluated block's results completed strictly before its arrival, folded in completion order; everything before the block is visible
  method: fixed point of schedule and scores from the original-clock scores; scores must repeat exactly
  max_iterations: 200
