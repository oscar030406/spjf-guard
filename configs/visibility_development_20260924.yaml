# Development recipe of 2026-09-24: visibility_development_20260922.yaml with the
# selection of record moved to outputs/selection_v4 (the Guard(1200) and two family
# rows below); nothing else differs.  The exact development rerun reads this file.
#
# Main development configuration.
#
# Everything the protocol lock has to pin lives in this file, so that freezing the
# protocol is one hash over one document rather than a reading of the source.  Anything
# absent here is either derived (the budget from the promise) or not a choice (the
# sealed terms, which live in src/spjf_guard/data/sealed.py).
#
# Chapter and section numbers refer to docs/research_plan.md.

name: main
description: CodeBench shared judge pool, development terms, five overlays, three loads

# --- data -------------------------------------------------------------------------- #
data:
  # The parsed event cache.  A path, not a constant: reparsing the 37 GB of archives is
  # not part of a reproduction run.  Rebuild it with scripts/build_cache.py.
  # The per-semester parquet the cache stage reads.  In the repository, not a scratch
  # path: it is the last input the package does not produce itself.
  # Every path here is relative to the repository root and is resolved against it, so
  # nothing in this file or in anything generated from it depends on where the checkout
  # sits.  data/ is git-ignored; data/derived/README.md says what each directory holds.
  # The publisher's per-semester archives, and the tables scripts/parse_archive.py
  # streams out of them.  Stage zero of the pipeline.
  archive_dir: data/codebench/archives
  raw_parquet_dir: data/codebench/parquet
  cache_dir: data/derived/codebench_cache_r4
  events_file: ev.parquet
  # The sealed terms' own cache, written by scripts/build_cache.py --pool sealed.  A file
  # of its own, never a rewrite of events_file: the development cache is the training
  # half of every forward fit, and the sealed run reads the two together.
  sealed_events_file: ev_sealed.parquet
  features_file: feat_ires0.parquet
  forward_predictions_file: forward_ires0.parquet
  score_predictions_file: data/derived/ranking_score_predictions/rs_pred_ires0.parquet
  # Where the package writes and reads its own two intermediate products.  Both are
  # regenerated by scripts/build_overlays.py and scripts/fit_scores.py.
  overlay_dir: data/derived/overlay_traces
  score_dir: data/derived/package_ranking_scores
  # sha256 of every input artefact, filled in by scripts/make_protocol_lock.py
  input_hashes: {}

semesters:
  train: ["2018-1", "2018-2", "2019-1", "2019-2"]
  train_remote: ["2020-ERE", "2020-1", "2020-2", "2021-1", "2021-2"]
  validation: ["2022-1"]
  development_test: ["2022-2"]
  sealed_test: ["2023-1", "2023-2", "2024-1"]
  # excluded from load and peak statistics: 2019-2 archive stops early, 2020-1 is ~3%
  # short; both stay in per-submission training
  excluded_from_load: ["2019-2", "2020-1"]
  overlay_pool: ["2020-ERE", "2020-2", "2021-1", "2021-2", "2022-1", "2022-2"]

# --- clock, jitter and the cost variable --------------------------------------------- #
clock:
  reading: result            # the event header is the instant the result was written
  arrival_rule: "t - C"      # arrival = header time minus the measured cost
  done_rule: "t"             # the outcome is readable at the header time
  delta_s: 0.0               # result-availability delay; sensitivity 60, 600, 3600
  test_block_outcome_lag_s: 60.0
  jitter:
    enabled: true
    key: cbjitter20260919
    id_columns: [semester, class, user, assessment, exercise, blk_i]
  limit_s: 60.0              # the observed platform time limit; C_cap = min(C, L)
  drop_zero_cost_terms: ["2020-ERE", "2020-1", "2020-2", "2021-1", "2021-2",
                         "2022-1", "2022-2"]

# --- features ------------------------------------------------------------------------ #
features:
  visibility_rule: "done_j + delta <= a_i"
  set: M4
  groups: [code_static, exercise_history, user_history, user_exercise_prior, schedule]
  # The original-clock scores remain an explicitly optimistic reference.  The headline
  # uses only replayed submissions from the same shifted class-term copy and delays every
  # result by D.  On the development cells max W_FCFS = 1544.602708 s, so the guard
  # theorem requires at most 2744.602708 s for G <= 1200 s; D = 3600 s leaves an
  # 855.397292 s (31.2%) margin.  Every run still reports W > D by policy and cell.
  headline_variant: conservative
  visibility_variants:
    original:
      score_suffix: ""
      delta_s: 0.0
      feature_group: M4
      history_scope: global
      eligible_results_only: false
    conservative:
      score_suffix: _conservative
      delta_s: 3600.0
      feature_group: M4
      history_scope: class_term
      eligible_results_only: true
      development_max_fcfs_wait_s: 1544.602708
      largest_guard_promise_s: 1200.0
      safety_margin_s: 855.397292
    static:
      score_suffix: _static
      delta_s: 0.0
      feature_group: STATIC
      history_scope: global
      eligible_results_only: false
  # Exact replay visibility is a separate, policy-specific experiment.  It starts from
  # the frozen original SPJF-E model and monotonically withholds only same-copy outcomes
  # that the current replay says were not complete at the target job's arrival.  Nothing
  # in this block changes the conservative headline above before the assessment is run.
  exact_visibility:
    algorithm: monotone_per_job_withholding
    base_score: spjf_e
    model_weights: frozen
    own_class_term_copy_outcome_rule: "completion_j <= replay_arrival_i"
    external_history_clock: original_relative
    same_semester_other_class_history: exogenous
    alternative_sensitivity: drop_same_semester_other_class_records
    sensitivity_policies: [Guard(600)]
    terminal_assertion: no_new_violation
    policies: [SPJF-E, Guard(300), Guard(600), Guard(1200), Aging(600)]
    fixed_lags_s: [60.0, 300.0, 900.0, 3600.0]
    selection_assessment: pending
    selection_cost_seed: 20260922
    reselection_budget_hours: 8.0
    development_overlays: [0, 1, 2, 3, 4]
    development_levels: [0, 1, 2]
  # the heavy label and the class cut-offs are refit per target term with no look-ahead
  heavy_quantile: 0.95
  heavy_reference_semesters: ["2018-1", "2018-2", "2019-1", "2019-2"]
  class_cut_quantiles: [0.3333333333333333, 0.6666666666666667]

# --- predictor ------------------------------------------------------------------------ #
predictor:
  model: lightgbm
  protocol: rolling_origin   # train only on terms whose first arrival precedes the target
  seed: 3
  # Fixed, because LightGBM's histogram reduction order depends on the thread count:
  # two runs are identical only when this, the seed and the two determinism flags agree.
  num_threads: 4
  deterministic: true
  force_row_wise: true
  n_estimators: 300
  learning_rate: 0.06
  num_leaves: 63
  min_child_samples: 50
  colsample_bytree: 1.0      # < 1 would make the sampled columns depend on their number
  subsample: 0.8
  subsample_freq: 1
  # The cut-offs inside the features are these terms' p95 and log terciles, except for a
  # target that would have contributed to them; then they are refit on its training rows.
  fixed_cutoff_terms: ["2018-1", "2018-2", "2019-1", "2019-2"]
  forward_from: "2019-1"
  scores:
    spjf_e:
      objective: tweedie
      tweedie_variance_power: 1.5
      target: c_cap_seconds
    spjf_log:
      objective: regression
      target: log1p_c_cap

# --- scheduling ------------------------------------------------------------------------ #
scheduling:
  # run_main keeps the original-clock rows as an optimistic reference so every existing
  # row remains bit-identical.  The frozen headline is emitted by run_visibility.py.
  ranking_score: spjf_e
  headline_ranking_score: spjf_e_conservative
  # One mechanism.  budget(q, t) = min(B0 + gam * (waiting at a_q) + eta k (t - a_q), Bmax)
  # and the guarantee depends on the cap Bmax = k(G - (3 - 2/k)L) alone; the shape of the
  # budget under the cap is a design freedom.  The three shapes below are the three
  # families the selection searches, with equally dense pre-stated grids.
  guard_budget: "min(B0 + gam * w_q + eta * k * (t - a_q), Bmax)"
  promises_s: [300.0, 600.0, 1200.0]
  bmax_rule: "k * (G - (3 - 2/k) * L)"
  selection:
    # Pre-stated grids.  Every budget value is multiplied by k/4, so one setting means the
    # same per-server budget at every k.  A constant budget's own promise is
    # B0/k + (3 - 2/k)L, so a fixed point is a candidate at G only when that promise, in
    # its worst cell, is at most G.
    grids:
      fixed:                               # eta = 0, gam = 0
        log_points: 32
        log_from_s: 15.0
        log_to_s: 4200.0                   # = Bmax(G = 1200, k = 4)
        anchors_s: [15.0, 30.0, 60.0, 120.0, 240.0, 360.0, 480.0, 600.0]
        include_equal_promise: true        # B0 = Bmax(G, k), one point per G
      capped:                              # gam = 0
        b0_base_s: [0.0, 15.0, 30.0, 60.0, 120.0, 240.0, 360.0, 480.0, 600.0]
        eta: [0.0, 0.25, 0.5, 0.75, 0.9, 0.95]
      hybrid:                              # the queue-length term
        b0_base_s: [0.0, 30.0, 120.0]
        gam_base_s: [1.0, 4.0, 16.0]
        eta: [0.0, 0.9]
    harm_fraction: 0.5                     # feasible iff harm <= G/2 in every cell
    objective: worst_cell_deadline_window_gap_closed
    tie_break: [smaller_worst_harm, smaller_b0, smaller_eta, smaller_gam]
    trace: validation_only                 # overlays built without the test term
    joint_winner: "best worst-cell gap over the three families; this is the paper's Guard(G)"
    family_names: {fixed: Guard-fixed, capped: Guard-age, hybrid: Guard-queue}
  # outputs/selection_v4: the rule rerun on the validation overlays that embed the
  # package's spjf_e scores, the scores every evaluation reads.  selection_v3 had read
  # overlays built 2026-09-20 with an earlier fit (rs_pred_ires0); it reproduces from
  # the archived copies in data/derived/overlay_traces_0920 (SHA256SUMS there).
  selected:                                # chosen on the validation overlays only
    "300.0": {family: capped, b0_base_s: 60.0, eta: 0.5, gam_base_s: 0.0}
    "600.0": {family: capped, b0_base_s: 120.0, eta: 0.75, gam_base_s: 0.0}
    "1200.0": {family: hybrid, b0_base_s: 120.0, eta: 0.0, gam_base_s: 16.0}
  family_best:                             # the ablation rows, same rule inside one family
    "300.0":
      fixed: {b0_base_s: 329.671, eta: 0.0, gam_base_s: 0.0}
      capped: {b0_base_s: 60.0, eta: 0.5, gam_base_s: 0.0}
      hybrid: {b0_base_s: 120.0, eta: 0.0, gam_base_s: 4.0}
    "600.0":
      fixed: {b0_base_s: 981.126, eta: 0.0, gam_base_s: 0.0}
      capped: {b0_base_s: 120.0, eta: 0.75, gam_base_s: 0.0}
      hybrid: {b0_base_s: 120.0, eta: 0.0, gam_base_s: 16.0}
    "1200.0":
      fixed: {b0_base_s: 2029.958, eta: 0.0, gam_base_s: 0.0}
      capped: {b0_base_s: 360.0, eta: 0.75, gam_base_s: 0.0}
      hybrid: {b0_base_s: 120.0, eta: 0.0, gam_base_s: 16.0}
  comparators:
    fixed_equal_promise: true              # eta = 0, B0 = Bmax; infeasible under the rule
    skip_charge: dispatch                  # N = floor(G k / L - (2k - 2))
  corrupted_scores: [reversed, random, longest_one_percent_called_shortest]
  aging_baseline:
    label: Aging(600)
    guarantee: none
    priority: "predicted_cost - credit_per_s * current_age_s"
    reference_promise_s: 600.0
    credit_per_s_grid: [0.00001, 0.00003, 0.0001, 0.0003, 0.001, 0.003,
                        0.01, 0.03, 0.1, 0.3, 1.0]
    selection:
      trace: validation_only
      constraint: "harm <= reference_promise_s / 2 in every cell"
      objective: worst_cell_deadline_window_gap_closed
      tie_break: [smaller_worst_harm, larger_credit]
    selected_credit_per_s: 0.03            # selected by the validation rule above

# --- load ------------------------------------------------------------------------------ #
overlay:
  reference_monday_epoch_s: 1578268800     # 2020-01-06 00:00:00 UTC
  week_s: 604800
  seed: 3                                  # copy shifts drawn from seed*100 + rep
  shift_weeks_max: 12
  copies_probe:
    min_servers_at_full_load: 4
    distinct_server_counts: 3
    stop_after_extra_copies: 5
  target_busy_hour_utilisation: [0.5, 0.8, 1.0]
  server_count_rule: "round_half_up(W / (3600 * rho)), at least 1"
  overlays: [0, 1, 2, 3, 4]
  # Which terms a named pool superposes.  `sealed` is just another entry here: the
  # loader refuses it until the protocol is frozen and --unseal is given, so the sealed
  # run goes through exactly the same code path as a development run.
  pools:
    primary: ["2020-ERE", "2020-2", "2021-1", "2021-2", "2022-1", "2022-2"]
    validation: ["2020-ERE", "2020-2", "2021-1", "2021-2", "2022-1"]
    sealed: ["2023-1", "2023-2", "2024-1"]
  # The single-server trace, where the identity of Theorem 1 is exact.  It has its own
  # selection: copies are added until the busiest hour at one server sits in the window,
  # closest to the target.  The pool it draws from is `primary`, and `--pool` overrides
  # it; `copies` is what that selection came to and is what another pool reuses, because
  # re-running the selection on the sealed pool would choose a design value on sealed
  # data.  The utilisation it then reaches is reported as it comes.  See ADR 0006.
  single_server:
    pool: primary
    copies: 321                            # selected on `primary`, busy hour 0.8000
    seed_offset: 50                        # drawn with seed*100 + 50 + 0, as v3.1 did
    target_utilisation: 0.80
    utilisation_window: [0.78, 0.82]
    pool_repeats: 8

# --- metrics and statistics ------------------------------------------------------------- #
metrics:
  primary: deadline_window_p99_wait
  deadline_window_s: 86400
  starts_immediately_s: 1.0                # the harm is measured among these jobs
  secondary: [mean_wait, max_excess, harm, fired_rate_queue_weighted, worst_heavy_wait,
              gap_closed]
bootstrap:
  method: paired_week_block
  resamples: 2000
  seed: 20260919
  block: whole_week
  paired_across: [policies, overlays]

# --- run ---------------------------------------------------------------------------------- #
run:
  assert_per_job_bounds: true              # inside the run, not afterwards on summaries
  output_dir: outputs
  segment_tree_window_ranks: 4194304
  # Exactly what the sealed run emits.  Pinned so that the set of tables cannot grow
  # after the sealed terms are opened.  One list per command, never merged: each is
  # compared with the files that command wrote, and a merged list would fail every time.
  sealed_tables:
    - main_cells.csv
    - main_table.csv
    - main_table.tex
    - paired_differences.csv
    - bound_checks.csv
    - identity_residuals.csv
    - policy_parameters.csv
    - manifest.json
  # The single-server run of the sealed pool, written under its own sub-directory.
  sealed_k1_tables:
    - main_cells.csv
    - main_table.csv
    - main_table.tex
    - paired_differences.csv
    - bound_checks.csv
    - identity_residuals.csv
    - policy_parameters.csv
    - manifest.json
  # The sealed terms' predictor metrics, from scripts/eval_scores.py.
  sealed_predictor_tables:
    - predictor_metrics.csv
    - manifest.json
  # Policy-consistent comparison and original-clock exposure audit.  It is a separate
  # sealed command because it fits no model and selects no parameter.
  sealed_visibility_tables:
    - visibility_cells.csv
    - visibility_comparison.csv
    - visibility_paired_differences.csv
    - visibility_exposure.csv
    - visibility_waits_and_lag.csv
    - manifest.json
  # Policy-specific exact visibility.  The number of affected jobs is data-dependent,
  # so `deltas/*.npz` are named and hashed by exact_delta_manifest.csv rather than being
  # placed in this exact-name list.
  sealed_consistent_visibility_tables:
    - exact_cells.csv
    - exact_comparison.csv
    - exact_passes.csv
    - same_copy_exposure_cells.csv
    - same_copy_exposure.csv
    - attribution_cells.csv
    - attribution_comparison.csv
    - exact_delta_manifest.csv
    - exact_costs.csv
    - exact_sensitivity_cells.csv
    - exact_sensitivity_comparison.csv
    - manifest.json
