# 机械闸门。人审规格与测试，代码由这些检查把关。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --select, "E,F,I,C901", --config, "lint.mccabe.max-complexity=10"]
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (不含 slow 与 crosscheck)
        entry: uv run --no-sync python -m pytest -q -m "not slow and not crosscheck"
        language: system
        pass_filenames: false
      - id: mypy-public-interface
        name: mypy（只查公开接口）
        entry: uv run --no-sync mypy
        language: system
        pass_filenames: false
      - id: generated-artifacts-fresh
        name: 生成物与其配方一致
        entry: uv run --no-sync python scripts/check_generated.py
        language: system
        pass_filenames: false
      - id: no-sealed-read
        name: 封存学期不得出现在 src/ 的字面量里（只许 sealed.py 命名）
        entry: python -c "import re,sys,pathlib;
          bad=[str(p) for p in pathlib.Path('src').rglob('*.py')
          if p.name!='sealed.py' and re.search(r'2023-1|2023-2|2024-1', p.read_text(encoding='utf-8'))];
          sys.exit('封存学期名出现在: '+', '.join(bad) if bad else 0)"
        language: system
        pass_filenames: false
