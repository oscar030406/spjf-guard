[project]
name = "spjf-guard"
version = "0.1.0"
description = "Reproducible pipeline for the overtake-budget guard scheduling study"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "numba>=0.60",
    "lightgbm>=4.3",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spjf_guard"]

[tool.ruff]
line-length = 96
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs the full 17.6 M-job trace or a LightGBM refit",
    "crosscheck: imports a read-only module from prechecks/",
]

[tool.mypy]
python_version = "3.12"
files = ["src/spjf_guard"]
ignore_missing_imports = true
disallow_untyped_defs = false
